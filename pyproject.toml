[project]
name = "wendao"
version = "0.1.0"
description = "An AI learning companion: turn course notes into an interactive knowledge graph and a course-grounded AI tutor"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["education", "learning", "knowledge graph", "rag", "llm", "tutor", "course"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
authors = [{ name = "Yanhao Deng" }, { name = "Zeyu Deng" }]
dependencies = [
    "flask>=3.0,<4",
    "nbformat>=5.9,<6",
    "numpy>=1.26,<3",
    "pyyaml>=6,<7",
    "scikit-learn>=1.4,<2",
    "sentence-transformers>=3,<6",
]

[project.optional-dependencies]
# Production WSGI server, used by deploy/mle-course-helper.service.
deploy = ["gunicorn>=22,<24"]

[project.scripts]
wendao = "wendao.cli:main"

[project.urls]
Homepage = "https://github.com/deng-group/wendao"
Documentation = "https://github.com/deng-group/wendao#readme"
Issues = "https://github.com/deng-group/wendao/issues"
"Example course" = "https://mle4217-5219.matsci.dev/"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wendao = ["web/static/**/*", "web/templates/*", "starter/*"]
