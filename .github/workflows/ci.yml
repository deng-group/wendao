name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python-version: "3.11" }
          - { os: ubuntu-latest, python-version: "3.13" }
          - { os: windows-latest, python-version: "3.12" }
          - { os: macos-latest, python-version: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install
        run: uv sync --frozen --extra deploy
      - name: Unit tests
        run: uv run python -m unittest discover -s tests -v

  wheel-install:
    # The package as pip installs it (not the dev environment) must search the example course and export
    # its graph page, on every operating system.
    name: wheel-install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install the built package
        run: |
          uv build --wheel
          uv venv "$RUNNER_TEMP/wheel"
          uv pip install --python "$RUNNER_TEMP/wheel" dist/*.whl
      - name: Search the example course and export its graph
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then bin="$RUNNER_TEMP/wheel/Scripts"; else bin="$RUNNER_TEMP/wheel/bin"; fi
          "$bin/wendao" ask -w examples/mle4217_5219 --search-only "What is a convex hull?"
          "$bin/wendao" export -w examples/mle4217_5219 -o "$RUNNER_TEMP/graph.html"
          test -s "$RUNNER_TEMP/graph.html"
