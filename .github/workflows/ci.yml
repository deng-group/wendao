name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install
        run: uv sync --frozen --extra teacher --extra deploy
      - name: Unit tests
        run: uv run python -m unittest discover -s tests -v

  student-install:
    # The base install (what students get) must open a real course file, offline, without the teacher tools.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Pack the example course (teacher install)
        run: |
          uv sync --frozen --extra teacher
          uv run wendao pack -w examples/mle4217_5219 -o /tmp/course.wendao
      - name: Install the base package only
        run: |
          uv build --wheel
          uv venv /tmp/student
          uv pip install --python /tmp/student/bin/python dist/*.whl
      - name: Open the course file as a student, offline
        env:
          HF_HUB_OFFLINE: "1"
          WENDAO_CACHE: /tmp/wendao-cache
        run: /tmp/student/bin/python tests/smoke_student_app.py /tmp/course.wendao "What is a convex hull?"
