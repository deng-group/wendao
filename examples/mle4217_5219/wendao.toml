# Wendao settings for NUS MLE4217/5219 Materials Informatics.
# The chunks, graph, and search index in build/ are already built, so you can run
# `wendao serve` or `wendao ask` right away. Rebuilding needs the course book repository
# (https://github.com/deng-group/MLE4217_5219_book) checked out next to Wendao.

[course]
name = "Materials Informatics"
code = "MLE4217/5219"
website = "https://mle4217-5219.matsci.dev/"

[source]
path = "../../../MLE4217_5219_book"
file_types = ["md", "ipynb"]   # the book's PDFs and HTML are figures and build output, not notes
exclude = ["AGENTS.md"]
ignore_dirs = ["ai_agent_widget"]

# Chapters in teaching order. "root" means the files at the top of the book (syllabus, calendar).
[[chapters]]
folder = "orientation"
name = "Orientation"
description = "Course introduction, setup, and learning environment."

[[chapters]]
folder = "programming"
name = "Programming"
description = "Python and scientific programming foundations."

[[chapters]]
folder = "computer"
name = "Computer and Computation"
description = "Hardware, software, version control, and performance."

[[chapters]]
folder = "database"
name = "Database"
description = "Materials databases, data formats, querying, and analysis."

[[chapters]]
folder = "structures"
name = "Structures"
description = "Crystal structures, symmetry, defects, interfaces, and representations."

[[chapters]]
folder = "models_and_theories_I"
name = "Models and Theories I"
description = "Atomistic models, force fields, and electronic structure."

[[chapters]]
folder = "models_and_theories_II"
name = "Models and Theories II"
description = "Statistical mechanics, molecular dynamics, and Monte Carlo."

[[chapters]]
folder = "optimization"
name = "Optimization"
description = "Energy landscapes and local and global optimization methods."

[[chapters]]
folder = "high_throughput"
name = "High-Throughput Methods"
description = "Automated workflows, thermodynamics, and materials discovery."

[[chapters]]
folder = "machine_learning_I"
name = "Machine Learning I"
description = "Machine-learning tasks, features, models, and validation."

[[chapters]]
folder = "machine_learning_II"
name = "Machine Learning II"
description = "Graphs, graph neural networks, and generative models."

[[chapters]]
folder = "machine_learning_potentials"
name = "Machine Learning Potentials"
description = "Interatomic machine-learning models and their training."

[[chapters]]
folder = "midterm_review"
name = "Midterm Review"
description = "Review material for the first part of the course."
show = "secondary"

[[chapters]]
folder = "final_review"
name = "Final Review"
description = "Review material connecting the full course."
show = "secondary"

[[chapters]]
folder = "root"
name = "Course Information"
description = "Syllabus, calendar, and course-level information."
show = "hidden"

[[chapters]]
folder = "figures"
name = "Figure Sources"
description = "Supporting figure-generation material."
show = "hidden"

[search]
aliases = { convexhull = "convex hull", highthroughput = "high throughput", materialsproject = "materials project", machinelearning = "machine learning" }

[graph]
bridge_stop_concepts = [
    "ase", "database", "feature", "git", "github", "interface", "jupyter-notebook", "machine-learning",
    "matplotlib", "molecule", "numpy", "optimization", "pandas", "pymatgen", "python", "version-control", "workflow",
]

[student]
# Students open the course app with their own key; set `server` to the course's Wendao website to
# let them use the course AI instead.
ai = "either"

[widget]
# Search engines for text students highlight on the course website.
web_search = ["google", "scholar", "wikipedia", "arxiv"]

[model]
# The course uses an Anthropic-compatible relay. Put ANTHROPIC_AUTH_TOKEN in .env.
provider = "anthropic"
base_url = "https://claude.matsci.dev"
model = "deepseek-v4-flash"
