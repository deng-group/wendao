<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f9fc" />
    <meta
      name="description"
      content="Explore the {{COURSE_DISPLAY_NAME}} course as a connected knowledge graph."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Crect width='128' height='128' rx='30' fill='%23ffffff'/%3E%3Cpath d='M40 50 C40 31 52 23 64 23 C79 23 90 33 90 47 C90 60 80 65 72 70 C66 74 64 78 64 85' fill='none' stroke='%238a98ad' stroke-width='7' stroke-linecap='round'/%3E%3Ccircle cx='40' cy='50' r='10' fill='%23fff' stroke='%232563eb' stroke-width='6'/%3E%3Ccircle cx='90' cy='47' r='11' fill='%232563eb'/%3E%3Ccircle cx='64' cy='85' r='10' fill='%23fff' stroke='%232563eb' stroke-width='6'/%3E%3Ccircle cx='64' cy='106' r='9' fill='%23d97706'/%3E%3C/svg%3E"
    />
    <title>Wendao · {{COURSE_NAME}}</title>
    <link rel="stylesheet" href="./style.css?v=11" />
  </head>
  <body>
    <main class="app-shell">
      <section class="graph-workspace" aria-label="Course knowledge graph">
        <header class="graph-header">
          <a class="brand" href="./" aria-label="Wendao home">
            <svg class="brand-mark" viewBox="0 0 128 128" aria-hidden="true"><path d="M40 50 C40 31 52 23 64 23 C79 23 90 33 90 47 C90 60 80 65 72 70 C66 74 64 78 64 85" fill="none" stroke="#8a98ad" stroke-width="7" stroke-linecap="round"/><circle cx="40" cy="50" r="10" fill="#fff" stroke="#2563eb" stroke-width="6"/><circle cx="90" cy="47" r="11" fill="#2563eb"/><circle cx="64" cy="85" r="10" fill="#fff" stroke="#2563eb" stroke-width="6"/><circle cx="64" cy="106" r="9" fill="#d97706"/></svg>
            <span><strong>Wendao</strong><small>{{COURSE_LABEL}}</small></span>
          </a>

          <label class="search-box">
            <span class="sr-only">Search course concepts</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg>
            <input id="graph-search" type="search" placeholder="Find a chapter or concept" autocomplete="off" />
            <kbd>⌘ K</kbd>
          </label>

          <div class="graph-actions" aria-label="Graph controls">
            <button id="reset-view" class="icon-control" type="button" aria-label="Reset graph view" title="Reset view">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11a8 8 0 1 1 2.3 5.7"></path><path d="M4 5v6h6"></path></svg>
            </button>
            <button id="fit-view" class="icon-control" type="button" aria-label="Fit graph to screen" title="Fit graph">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"></path></svg>
            </button>
            <button id="open-chat" class="chat-launcher" type="button" aria-controls="chat-panel" aria-expanded="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14v11H9l-4 3V5Z"></path><path d="M8 9h8M8 12h5"></path></svg>
              <span>Ask AI</span>
            </button>
          </div>
        </header>

        <div id="search-results" class="search-results" hidden></div>

        <div id="graph-stage" class="graph-stage">
          <svg id="graph-svg" role="img" aria-label="Interactive course concept network">
            <defs>
              <filter id="node-glow" x="-80%" y="-80%" width="260%" height="260%">
                <feGaussianBlur stdDeviation="5" result="blur"></feGaussianBlur>
                <feMerge><feMergeNode in="blur"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
              </filter>
            </defs>
            <g id="graph-viewport">
              <g id="edge-layer"></g>
              <g id="node-layer"></g>
            </g>
          </svg>

          <div id="graph-hint" class="graph-hint"><span></span> Overview — use the legend to filter by level</div>

          <article id="node-card" class="node-card" hidden>
            <button id="close-node-card" class="card-close" type="button" aria-label="Close concept details">×</button>
            <p id="node-kind" class="node-kind">Chapter</p>
            <h2 id="node-title">Structures</h2>
            <button id="ask-node" class="ask-node" type="button">Ask a question <span>→</span></button>
          </article>

          <div class="legend" aria-label="Filter graph by node level">
            <button id="legend-chapter" type="button" aria-pressed="false" title="Show chapters only"><i class="chapter-dot"></i>Chapter</button>
            <button id="legend-concept" type="button" aria-pressed="false" title="Show concepts only"><i class="concept-dot"></i>Concept</button>
          </div>
        </div>
      </section>

      <aside id="chat-panel" class="chat-panel" aria-label="Course AI assistant" aria-hidden="true" hidden>
        <header class="chat-header">
          <div>
            <p class="eyebrow">COURSE AI</p>
            <h1>Learning Agent</h1>
          </div>
          <div class="chat-header-actions">
            <div class="grounded-badge"><span></span>Course-grounded</div>
            <button id="clear-chat" class="chat-clear" type="button" aria-label="Clear conversation" title="Clear conversation">Clear</button>
            <button id="close-chat" class="chat-close" type="button" aria-label="Close Learning Agent" title="Close Learning Agent">×</button>
          </div>
        </header>

        <div id="context-bar" class="context-bar" hidden>
          <span>Context</span>
          <button id="context-chip" type="button" title="Remove context"><b></b><i>×</i></button>
          <button id="explain-node" class="explain-node" type="button">Explain</button>
        </div>

        <section id="messages" class="messages" aria-label="Conversation" aria-live="polite" tabindex="0">
          <article class="message assistant">
            <div class="assistant-avatar" aria-hidden="true">W</div>
            <div>
              <p>Choose a node, then select Explain—or ask a question about the course.</p>
              <small>Answers use only the provided course materials.</small>
            </div>
          </article>
        </section>

        <section id="suggestions" class="suggestions" aria-label="Suggested questions">
          <button type="button">How do the main course chapters connect?</button>
          <button type="button">What should I understand before machine learning potentials?</button>
        </section>

        <section id="source-drawer" class="source-drawer" hidden>
          <button id="source-toggle" type="button" aria-expanded="false"><span>Course sources</span><b id="source-count">0</b></button>
          <div id="source-list" hidden></div>
        </section>

        <form id="chat-form" class="composer">
          <label for="question" class="sr-only">Ask a course question</label>
          <textarea id="question" rows="1" placeholder="Ask about the course…"></textarea>
          <div class="composer-footer">
            <span>↵ Send · ⇧↵ New line</span>
            <button id="send-question" type="submit" aria-label="Send question">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 14-7-4 14-3-6-7-1Z"></path><path d="m12 13 7-8"></path></svg>
            </button>
          </div>
        </form>
      </aside>
    </main>

    <script src="./app.js?v=12"></script>
  </body>
</html>
